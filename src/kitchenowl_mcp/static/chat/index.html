<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KitchenOwl Chat</title>
<link rel="stylesheet" href="/chat/static/style.css">
</head>
<body>
<div class="wrap">
  <header>
    <h1>KitchenOwl Chat</h1>
    <div class="header-actions">
      <button type="button" id="clear-btn" class="clear-btn">New chat</button>
      <form method="post" action="/chat/logout" class="logout-form">
        <button type="submit" class="logout-btn">Log out</button>
      </form>
    </div>
  </header>
  <div id="messages"></div>
  <div id="quick-actions" class="quick-actions">
    <button type="button" class="chip" data-prompt="Show my meal plan: list each planned recipe's title alongside its planned date, in date order.">Show meal plan</button>
    <button type="button" class="chip" data-prompt="Show my current shopping list.">Show grocery list</button>
    <button type="button" class="chip" data-prompt="I want to create a new recipe. Interview me first, one question at a time: what ingredients I have on hand or want to use, how many people it should serve, any allergies or dietary restrictions to avoid, and any other preferences (cuisine, time budget, etc). Only draft the recipe once you have enough to work with.">Create new recipe</button>
  </div>
  <form id="composer" autocomplete="off">
    <input type="text" id="input" placeholder="Ask about recipes, shopping list, meal plan…" autofocus>
    <button type="submit" class="primary">Send</button>
  </form>
</div>
<script src="/chat/static/app.js"></script>
</body>
</html>
